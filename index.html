<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Estudio Fitness - PWA de Entrenamiento</title>
  
  <!-- PWA Meta Tags -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#070709">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Estudio Fitness">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.svg">
  <link rel="icon" type="image/svg+xml" href="./icons/favicon.svg">
  <link rel="shortcut icon" href="./icons/favicon.svg">

  <!-- Estilos & Fuentes -->
  <link rel="stylesheet" href="./src/styles.css">

  <!-- La VAPID public key ya no se pega acá a mano: el frontend la pide en
       runtime a /api/vapid-public-key (Vercel) o
       /.netlify/functions/vapid-public-key (Netlify), que la sirven desde
       la misma variable de entorno VAPID_PUBLIC_KEY que ya usa
       /api/send-push.js para enviar. Un solo origen de verdad, sin
       duplicar la clave ni hardcodear nada acá. -->

  <!-- Supabase JS Client SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Lucide (autohospedado, ver icons/lucide.min.js — solo bell-ring y log-out) -->
  <script src="./icons/lucide.min.js"></script>
</head>
<body>

  <!-- Contenedor Principal de la Aplicación -->
  <div id="app"></div>

  <!-- Módulos JS -->
  <script src="./src/supabase.js"></script>
  <script src="./src/data.js"></script>
  <script src="./src/app.js"></script>
</body>
</html>
