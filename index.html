<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Estudio Fitness - PWA de Entrenamiento</title>
  
  <!-- PWA Meta Tags -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#070709">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Estudio Fitness">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.svg">
  <link rel="icon" type="image/svg+xml" href="./icons/favicon.svg">
  <link rel="shortcut icon" href="./icons/favicon.svg">

  <!-- Estilos & Fuentes -->
  <link rel="stylesheet" href="./src/styles.css">

  <!-- VAPID PUBLIC KEY para Web Push (VER DIAGNÓSTICO): descomentar y pegar
       la clave pública real (la misma que VAPID_PUBLIC_KEY en las env vars
       de Vercel para /api/send-push.js) para reemplazar el placeholder.
       Es una clave PÚBLICA, no un secreto: es seguro que viva en el
       frontend. Mientras esta línea esté comentada, la app sigue usando la
       clave dummy de fallback (supabase.js/app.js), que NO es válida para
       suscribir dispositivos nuevos que todavía no tengan una suscripción
       guardada en el navegador.
  <script>
    window.ENV_VAPID_PUBLIC_KEY = "PEGAR_AQUI_TU_VAPID_PUBLIC_KEY_REAL";
  </script>
  -->

  <!-- Supabase JS Client SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- Contenedor Principal de la Aplicación -->
  <div id="app"></div>

  <!-- Módulos JS -->
  <script src="./src/supabase.js"></script>
  <script src="./src/data.js"></script>
  <script src="./src/app.js"></script>
</body>
</html>
